name: Multi-Region Bus Arrival Notifier (Daejeon / Seongnam / Seoul)

# 텔레그램 자동 알림은 앱으로 옮겨서 꺼 둠 (push · 예약 실행 없음).
# 필요할 때는 Actions 탭에서 수동 실행(workflow_dispatch)만 가능.
on:
  workflow_dispatch:
    inputs:
      run_once_now:
        description: '실행 모드 선택 (false: 배치 감시 / true: 즉시 1회만 테스트)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      region:
        description: '조회 권역 선택 (daejeon / seongnam / gyeonggi / seoul)'
        required: false
        default: 'daejeon'
        type: choice
        options:
          - 'daejeon'
          - 'seongnam'
          - 'gyeonggi'
          - 'seoul'
      stop_no:
        description: '5자리 정류소 번호'
        required: false
        default: '11690'
        type: string
      routes:
        description: '감시할 버스 노선번호'
        required: false
        default: '311'
        type: string

concurrency:
  group: bus-arrival-monitor
  cancel-in-progress: false

jobs:
  monitor-buses:
    runs-on: ubuntu-latest
    timeout-minutes: 100 # 90분 실행을 보장하기 위해 100분으로 설정

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run Multi-Region Bus Polling & Gemini Briefing
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUS_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.region || 'daejeon' }}
          BUS_STOP_ARS_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.stop_no || '11690' }}
          BUS_ROUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.routes || '311' }}
          ALERT_THRESHOLD_MIN: '5'
          POLL_INTERVAL_SEC: '60'
          BATCH_DURATION_MIN: '90' # 알림 유지 시간을 90분(1시간 반)으로 늘림
          SEND_START_SUMMARY: 'true'
          RUN_ONCE_NOW: ${{ github.event_name == 'push' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_once_now || 'false') }}
        run: python bus_notifier.py
