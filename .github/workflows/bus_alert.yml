# 전국 통합(대전·성남/경기·서울) 다중 정류장·다중 버스 도착 N분 전 제미나이×텔레그램 알림 구축 가이드 (GitHub Actions)

이 문서는 기존의 **[대전 명석고등학교(11690)](https://www.google.com/search?q=https%3A%2F%2Fnamu.wiki%2Fw%2F%25EB%25AA%2585%25EC%2584%259D%25EA%25B3%25A0%25EB%2593%25B1%25ED%2595%2599%25EA%25B5%2590) [311번 버스](https://www.google.com/search?q=https%3A%2F%2Fbus.koreacharts.com%2Fcity-bus%2F25%2FDJB30300055.html)** 알림을 넘어, **성남시·경기도 전역**과 **서울특별시 전역**, 그리고 **전국 지자체(대전 등)**의 원하는 정류장과 여러 버스 노선을 동시에 감시하여 도착 N분 전 **[Google GenAI SDK](https://www.google.com/search?q=https%3A%2F%2Fai.google.dev%2Fgemini-api%2Fdocs%2Flibraries)** 브리핑을 **[Telegram Bot API](https://www.google.com/search?q=https%3A%2F%2Fcore.telegram.org%2Fbots%2Fapi)**로 발송하는 통합 가이드입니다.

## 1. 권역별 연동 API 및 자동 처리 방식

동일한 공공데이터포털(`DATA_GO_KR_API_KEY`) 인증키 하나로 3개 권역 API를 모두 호출할 수 있으며, 정류장에 적힌 **5자리 정류소 번호(ARS-ID / mobileNo)**만 입력하면 내부 표준 ID를 자동으로 찾아냅니다.

| 권역 구분 (`region`) | 연동 공공데이터포털 OpenAPI | 정류소 번호 입력 방식 | 제공되는 특화 정보 |
| :--- | :--- | :--- | :--- |
| **대전·전국 지자체** (`daejeon` / `tago`) | • [국토교통부(TAGO) 버스도착정보](https://www.google.com/search?q=https%3A%2F%2Fwww.data.go.kr%2Fdata%2F15098530%2Fopenapi.do)<br>• [국토교통부(TAGO) 버스정류소정보](https://www.google.com/search?q=https%3A%2F%2Fwww.data.go.kr%2Fdata%2F15098534%2Fopenapi.do) | 5자리 정류소 번호 (예: 명석고 `11690`) → 표준 `nodeId`(`DJB800...`) 자동 변환 | 초 단위 도착예상시간(`arrtime`), 남은 정류장 수, 저상/일반 차량유형 |
| **성남시·경기도권** (`seongnam` / `gyeonggi`) | • [경기도\_버스도착정보 조회(v2)](https://www.google.com/search?q=https%3A%2F%2Fwww.data.go.kr%2Fdata%2F15080346%2Fopenapi.do)<br>• [경기도\_정류소 조회(v2)](https://www.google.com/search?q=https%3A%2F%2Fwww.data.go.kr%2Fdata%2F15080666%2Fopenapi.do%3FrecommendDataYn%3DY) | 5자리 정류소 번호(`mobileNo`, 예: 판교역 `07563` 등) → 9자리 `stationId` 자동 변환 | 도착예상시간(`predictTime1`), **광역·좌석버스 잔여 좌석 수(`remainSeatCnt1`)**, 저상/2층버스 여부, 차량번호(`plateNo1`) ([GBIS 매뉴얼](https://www.google.com/search?q=https%3A%2F%2Fwww.gbis.go.kr%2Fgbis2014%2FpublicService.action%3Fcmd%3DmBusArrivalStation)) |
| **서울특별시권** (`seoul`) | • [서울특별시\_버스도착정보조회](https://www.google.com/search?q=https%3A%2F%2Fwww.data.go.kr%2Fdata%2F15000314%2Fopenapi.do)<br>• [서울시 정류소정보조회(getStationByUid)](https://www.google.com/search?q=http%3A%2F%2Fapi.bus.go.kr%2Fcontents%2Fsub02%2FgetStationByUid.html) | 5자리 정류소 고유번호(`arsId`, 예: 강남역 `22009`, 하이픈 자동 제거) 즉시 조회 | 초 단위 도착시간(`traTime1`), 원문 도착메시지(`arrmsg1`), 진행방향(`adirection`), 차량번호(`plainNo1`) |

## 2. 공공데이터포털 추가 활용신청 목록 (성남·서울 확장용)

기존 대전(TAGO) 외에 성남(경기도) 및 서울권 정류장까지 조회하려면 공공데이터포털에서 아래 API들을 함께 **활용신청(모두 무료·즉시 자동승인)**해 두시면 동일한 `DATA_GO_KR_API_KEY`로 바로 작동합니다.

1. **대전·전국(TAGO)**: [국토교통부\_(TAGO)\_버스도착정보](https://www.google.com/search?q=https%3A%2F%2Fwww.data.go.kr%2Fdata%2F15098530%2Fopenapi.do), [국토교통부\_(TAGO)\_버스정류소정보](https://www.google.com/search?q=https%3A%2F%2Fwww.data.go.kr%2Fdata%2F15098534%2Fopenapi.do)
2. **성남·경기도(GBIS)**: [경기도\_버스도착정보 조회](https://www.google.com/search?q=https%3A%2F%2Fwww.data.go.kr%2Fdata%2F15080346%2Fopenapi.do), [경기도\_정류소 조회](https://www.google.com/search?q=https%3A%2F%2Fwww.data.go.kr%2Fdata%2F15080666%2Fopenapi.do%3FrecommendDataYn%3DY)
3. **서울특별시(TOPIS)**: [서울특별시\_버스도착정보조회 서비스](https://www.google.com/search?q=https%3A%2F%2Fwww.data.go.kr%2Fdata%2F15000314%2Fopenapi.do) (또는 [서울시 고유번호별 버스정류소 항목정보](https://www.google.com/search?q=https%3A%2F%2Fdata.seoul.go.kr%2FdataList%2FOA-15331%2FF%2F1%2FdatasetView.do) `getStationByUid` 포함 서비스)

## 3. 정류장·버스 설정 방법 (2가지 방식)

### 방식 A: 단일 정류장 + 여러 노선 간단 설정 (환경변수)

한 정류장에서 여러 버스(예: `311,103` 또는 성남 광역버스 `9000,3330`)를 볼 때는 워크플로우의 환경변수 3개만 바꾸면 됩니다.

* **대전 예시**: `BUS_REGION: 'daejeon'`, `BUS_STOP_ARS_ID: '11690'`, `BUS_ROUTES: '311,103,105'`
* **성남 예시**: `BUS_REGION: 'seongnam'`, `BUS_STOP_ARS_ID: '07563'`, `BUS_ROUTES: '340,55,9000'`
* **서울 예시**: `BUS_REGION: 'seoul'`, `BUS_STOP_ARS_ID: '22009'`, `BUS_ROUTES: '140,470,9404'`

### 방식 B: 대전·성남·서울 여러 정류장을 동시에 감시 (`TARGETS_JSON`)

여러 지역·정류장을 한 번에 감시하고 싶다면 `TARGETS_JSON`에 배열 형태로 원하는 만큼 추가할 수 있습니다. 각 정류장마다 도착 알림 기준(`threshold_min`)을 다르게 줄 수도 있습니다.

```json
[
  {
    "region": "daejeon",
    "stop_no": "11690",
    "stop_name": "대전 명석고등학교 (폴리텍·대전역 방면)",
    "routes": ["311", "103"],
    "threshold_min": 5
  },
  {
    "region": "seongnam",
    "stop_no": "07563",
    "stop_name": "성남 판교역동편",
    "routes": ["340", "9000"],
    "threshold_min": 7
  },
  {
    "region": "seoul",
    "stop_no": "22009",
    "stop_name": "서울 강남역중앙차로",
    "routes": ["140", "9404"],
    "threshold_min": 5
  }
]
```

## 4. `.github/workflows/bus_alert.yml` 전체 워크플로우 코드

GitHub 저장소에서 **Add file → Create new file**을 누르고 파일 이름을 **`.github/workflows/bus_alert.yml`**로 적은 뒤 아래 코드를 그대로 붙여넣으세요.

```yaml
name: Multi-Region Bus Arrival Notifier (Daejeon / Seongnam / Seoul)

on:
  schedule:
    # UTC 22:15 (일~목) = KST 07:15 (월~금 평일 아침)
    # 07:15에 미리 켜진 후 07:20:00 ~ 07:40:00 KST 동안 1분 간격으로 감시합니다.
    - cron: '15 22 * * 0-4'
  workflow_dispatch:
    inputs:
      run_once_now:
        description: '현재 시각 기준으로 즉시 1회 테스트 알림 받기'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      region:
        description: '조회 권역 선택 (daejeon / seongnam / gyeonggi / seoul)'
        required: false
        default: 'daejeon'
        type: choice
        options:
          - 'daejeon'
          - 'seongnam'
          - 'gyeonggi'
          - 'seoul'
      stop_no:
        description: '5자리 정류소 번호 (ARS-ID / mobileNo, 예: 대전 11690, 성남 07563, 서울 22009)'
        required: false
        default: '11690'
        type: string
      routes:
        description: '감시할 버스 노선번호 (콤마로 다중 지정 가능, 예: 311,103)'
        required: false
        default: '311'
        type: string

jobs:
  monitor-buses:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run Multi-Region Bus Polling & Gemini Briefing
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 수동 실행 시 입력값을 우선 적용하고, 정기 스케줄 실행 시 기본값을 사용합니다.
          BUS_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.region || 'daejeon' }}
          BUS_STOP_ARS_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.stop_no || '11690' }}
          BUS_ROUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.routes || '311' }}
          ALERT_THRESHOLD_MIN: '5'
          POLL_INTERVAL_SEC: '60'
          RUN_ONCE_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.run_once_now || 'false' }}
          # 여러 지역·정류장을 동시에 감시하려면 아래 TARGETS_JSON 주석을 해제해 사용하세요.
          # TARGETS_JSON: |
          #   [
          #     {"region": "daejeon", "stop_no": "11690", "stop_name": "명석고등학교(11690)", "routes": ["311"], "threshold_min": 5},
          #     {"region": "seongnam", "stop_no": "07563", "stop_name": "판교역동편", "routes": ["340", "9000"], "threshold_min": 7},
          #     {"region": "seoul", "stop_no": "22009", "stop_name": "강남역중앙차로", "routes": ["140", "9404"], "threshold_min": 5}
          #   ]
        run: python bus_notifier.py
```

## 5. GitHub Secrets(암호화 금고) 등록 및 즉시 테스트 방법

1. **Secrets 4개 등록**: GitHub 저장소 상단 **Settings → 좌측 Secrets and variables → Actions → New repository secret**에서 아래 4개를 등록합니다.
   * `DATA_GO_KR_API_KEY`: 공공데이터포털 일반 인증키 (Decoding 키 권장)
   * `GEMINI_API_KEY`: [Google AI Studio](https://www.google.com/search?q=https%3A%2F%2Fai.google.dev%2Fgemini-api%2Fdocs)에서 발급한 Gemini API 키
   * `TELEGRAM_BOT_TOKEN`: `@BotFather`에서 발급한 텔레그램 봇 토큰 ([Telegram Bot API](https://www.google.com/search?q=https%3A%2F%2Fcore.telegram.org%2Fbots%2Fapi))
   * `TELEGRAM_CHAT_ID`: 알림을 수신할 본인의 텔레그램 `chat_id` 숫자 ([확인 방법 안내](https://www.google.com/search?q=https%3A%2F%2Fwww.unipile.com%2Ftelegram-api-send-message-a-comprehensive-guide%2F))
2. **즉시 테스트 (`Run workflow`)**:
   * 저장소 상단 **Actions 탭 → Multi-Region Bus Arrival Notifier 선택 → 우측 Run workflow 클릭** 후 실행하면 약 20~30초 내에 텔레그램으로 실시간 버스 브리핑이 도착합니다.
