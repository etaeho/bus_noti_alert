name: Multi-Region Bus Arrival Notifier (Daejeon / Seongnam / Seoul)

on:
  push:
    branches:
      - main
      - master
  schedule:
    # UTC 22:15 (일~목) = KST 07:15 (월~금 평일 아침)
    # 07:15에 미리 켜진 후 07:20:00 ~ 07:40:00 KST 동안 1분 간격으로 감시합니다.
    # - cron: '15 22 * * 0-4'
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      run_once_now:
        description: '현재 시각 기준으로 즉시 1회 테스트 알림 받기'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      region:
        description: '조회 권역 선택 (daejeon / seongnam / gyeonggi / seoul)'
        required: false
        default: 'daejeon'
        type: choice
        options:
          - 'daejeon'
          - 'seongnam'
          - 'gyeonggi'
          - 'seoul'
      stop_no:
        description: '5자리 정류소 번호 (ARS-ID / mobileNo, 예: 대전 11690, 성남 07563, 서울 22009)'
        required: false
        default: '11690'
        type: string
      routes:
        description: '감시할 버스 노선번호 (콤마로 다중 지정 가능, 예: 311,103)'
        required: false
        default: '311'
        type: string

jobs:
  monitor-buses:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run Multi-Region Bus Polling & Gemini Briefing
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUS_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.region || 'daejeon' }}
          BUS_STOP_ARS_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.stop_no || '11690' }}
          BUS_ROUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.routes || '311' }}
          ALERT_THRESHOLD_MIN: '5'
          POLL_INTERVAL_SEC: '60'
          # 파일을 저장(push)하거나 수동 실행(workflow_dispatch)할 때는 즉시 1회 테스트로 동작하고,
          # 아침 정기 스케줄(schedule)일 때만 07:20~07:40 대기 및 반복 감시 모드로 동작합니다.
          RUN_ONCE_NOW: ${{ github.event_name == 'schedule' && 'false' || (github.event_name == 'workflow_dispatch' && inputs.run_once_now || 'true') }}
        run: python bus_notifier.py
