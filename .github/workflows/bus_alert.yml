name: Multi-Region Bus Arrival Notifier (Daejeon / Seongnam / Seoul)

on:
  push:
    branches:
      - main
      - master
  schedule:
    # GitHub Actions 크론 지연 및 누락 방지를 위해 이중 스케줄(매일 KST 07:05, 07:18) 등록
    # UTC 22:05 = 한국 시간(KST) 오전 07:05 (미리 켜져서 07:20까지 대기 후 07:40까지 1분 간격 감시)
    - cron: '5 22 * * *'
    # UTC 22:18 = 한국 시간(KST) 오전 07:18 (첫 크론이 지연·누락되었을 때 백업 실행)
    - cron: '18 22 * * *'
  workflow_dispatch:
    inputs:
      run_once_now:
        description: '실행 모드 선택 (false: 20분간 1분 간격 배치 감시 / true: 즉시 1회만 테스트)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      region:
        description: '조회 권역 선택 (daejeon / seongnam / gyeonggi / seoul)'
        required: false
        default: 'daejeon'
        type: choice
        options:
          - 'daejeon'
          - 'seongnam'
          - 'gyeonggi'
          - 'seoul'
      stop_no:
        description: '5자리 정류소 번호 (ARS-ID / mobileNo, 예: 대전 11690, 성남 07563, 서울 22009)'
        required: false
        default: '11690'
        type: string
      routes:
        description: '감시할 버스 노선번호 (콤마로 다중 지정 가능, 예: 311,103)'
        required: false
        default: '311'
        type: string

# 동일 배치잡이 중복으로 2개 동시에 도는 것을 방지 (이미 07:05 배치가 돌고 있으면 07:18 배치는 자동 건너뜀)
concurrency:
  group: bus-arrival-monitor
  cancel-in-progress: false

jobs:
  monitor-buses:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run Multi-Region Bus Polling & Gemini Briefing
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUS_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.region || 'daejeon' }}
          BUS_STOP_ARS_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.stop_no || '11690' }}
          BUS_ROUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.routes || '311' }}
          ALERT_THRESHOLD_MIN: '5'
          POLL_INTERVAL_SEC: '60'
          BATCH_DURATION_MIN: '20'
          SEND_START_SUMMARY: 'true'
          # 코드 수정 저장(push) 시에는 빠르게 1회 점검('true')하고,
          # 정기 스케줄(schedule) 또는 수동 실행(workflow_dispatch 기본값 'false') 시에는 20분간 1분 간격 배치 잡이 돌아갑니다.
          RUN_ONCE_NOW: ${{ github.event_name == 'push' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_once_now || 'false') }}
        run: python bus_notifier.py
